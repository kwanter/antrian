<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Antrian Display</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#0f172a;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
    .topbar{position:absolute;top:0;left:0;right:0;height:10vh;min-height:60px;display:flex;align-items:center;padding:0 20px;background:linear-gradient(135deg,#1e3a5f 0%,#0f172a 100%);border-bottom:2px solid #1d4ed8;z-index:10}
    .topbar .logo{font-size:28px;font-weight:900;margin-right:24px;color:#60a5fa;flex-shrink:0}
    .topbar .name{font-size:22px;font-weight:700;margin-right:16px}
    .topbar .loc{font-size:14px;color:#94a3b8}
    .topbar .date-wrap{flex:1;text-align:right}
    .topbar .date{font-size:15px;color:#94a3b8}
    .topbar .time{font-size:22px;font-weight:900;color:#60a5fa}
    .video-wrap{position:absolute;top:10vh;left:10px;right:10px;bottom:37vh;border-radius:12px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
    video{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
    .novideo{display:none;align-items:center;justify-content:center;font-size:26px;color:#64748b;width:100%;height:100%;text-align:center;padding:0 24px}
    #video-host{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    .start-overlay{position:absolute;top:10vh;left:10px;right:10px;bottom:37vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,23,42,.88);z-index:5;cursor:pointer;border-radius:12px;border:3px solid #1d4ed8}
    .start-overlay .icon{font-size:72px;margin-bottom:20px;animation:pulse 2s infinite}
    .start-overlay .text{font-size:34px;font-weight:700;color:#60a5fa;text-align:center;line-height:1.4}
    .start-overlay .hint{font-size:16px;color:#64748b;margin-top:12px}
    .err{position:absolute;top:11vh;left:20px;right:20px;padding:10px 16px;background:#450a0a;color:#fca5a5;border-radius:8px;font-size:14px;display:none;z-index:20}
    .footer{position:absolute;left:10px;right:10px;bottom:10px;height:7vh;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1e293b;color:#fff;border-radius:14px;padding:10px 16px;box-shadow:0 6px 18px rgba(15,23,42,.5);z-index:10}
    .footer .time{font-size:24px;font-weight:900;letter-spacing:1px}
    .footer .announce{font-size:12px;color:#86efac;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
    .footer .sync{font-size:12px;color:#94a3b8}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.96)}}
    @media (max-width:768px){
      .topbar .logo{font-size:20px}.topbar .name{font-size:16px}.topbar .loc{font-size:12px}.topbar .time{font-size:16px}
      .footer{height:5vh;min-height:36px;padding:6px 12px}.footer .time{font-size:14px}.footer .announce{font-size:10px}
      .start-overlay .icon{font-size:48px}.start-overlay .text{font-size:22px}
    }
    .mode-few .queue-row{flex:0 0 auto;padding:8px 10px 10px}
    .mode-few .card{flex:1 1 100%;max-width:100%}
    .mode-few .card .ticket{font-size:52px;min-height:64px}
    .mode-normal .queue-row{flex:0 0 auto;padding:6px 10px 8px}
    .mode-normal .card{flex:1 1 calc(25% - 8px);min-width:180px}
    .mode-normal .card .ticket{font-size:36px;min-height:48px}
    .mode-many .queue-row{flex:0 0 auto;padding:4px 10px 6px;bottom:calc(7vh + 20px)}
    .mode-many .card{flex:1 1 calc(16.6% - 10px);min-width:170px}
    .mode-many .card .ticket{font-size:28px;min-height:40px}
    .queue-row{position:absolute;left:10px;right:10px;top:64vh;bottom:calc(7vh + 20px);display:flex;gap:10px;z-index:10;overflow-x:auto;overflow-y:hidden;padding:4px 0}
    .queue-row::-webkit-scrollbar{height:4px}
    .queue-row::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
    .card{flex:0 0 calc(25% - 8px);height:100%;background:#1e293b;border-radius:10px;overflow:hidden;border:1px solid #334155;display:flex;flex-direction:column}
    .card .service{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#334155;min-height:42px}
    .card .service-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card .service-code{font-size:10px;color:#60a5fa;background:#1e3a5f;padding:1px 6px;border-radius:4px;white-space:nowrap;flex-shrink:0}
    .card .body{padding:8px 10px}
    .card .ticket{font-size:36px;font-weight:900;margin:4px 0 2px;text-align:center;letter-spacing:2px;min-height:48px;display:flex;align-items:center;justify-content:center;word-break:break-all}
    .card .loket{text-align:center;font-size:16px;font-weight:700;color:#10b981;margin:2px 0}
    .card .status{text-align:center;font-size:12px;padding:3px 8px;border-radius:20px;display:inline-block;margin:2px auto;width:auto;min-width:80px}
    .card .status.calling{background:#1d4ed8;color:#fff;font-weight:700;animation:blink 1.5s infinite}
    .card .status.completed{background:#064e3b;color:#6ee7b7}
    .card .status.waiting{background:#1e293b;color:#64748b}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo">📋 ANTRIAN</div>
    <div class="info">
      <div class="name" id="displayName">Memuat...</div>
      <div class="loc" id="displayLoc"></div>
    </div>
    <div class="date-wrap">
      <div class="date" id="date"></div>
      <div class="time" id="time">--:--:--</div>
    </div>
  </div>

  <div class="video-wrap">
    <div id="novideo" class="novideo"></div>
    <!-- This div is replaced after announcer audio ends to get a fresh video element -->
    <div id="video-host"></div>
  </div>

  <div class="start-overlay" id="start">
    <div class="icon">📺</div>
    <div class="text">Tekan tombol OK / ENTER<br>untuk mulai tampilan</div>
    <div class="hint">atau ketuk layar</div>
  </div>

  <div class="err" id="err"></div>

  <div class="footer">
    <div class="time" id="time">--:--:--</div>
    <div class="announce" id="announce">🔔 announcer: -</div>
    <div class="sync" id="sync">sync: -</div>
  </div>
<script>
(function(){
  var API='/api/v1'; var TZ='Asia/Makassar'; var TZ_LABEL='WITA';
  var display=null, videos=[], videoIndex=0, started=false;
  var announcerSettings={}, audioUnlocked=false, lastAnnounced={};
  var isAnnouncing=false, savedVideoIndex=0, savedVideoTime=0;
  var announceAudio=null; // standalone Audio element for announcer
  // ── Composite mode (no ?display= param) ────────────────────────────────────
  // Single server pre-rendered MP4 mixes every active display panel+volume, so
  // the TV needs ONE decoder. Composite status/video URL come from the public
  // read-only /display-composite endpoint (rendering itself is done by the
  // CLI watcher, never by this page). Generations swap at clip boundaries or
  // after announcer handoff — never mid-clip, never mid-announcement.
  var compositeMode=false, explicitDisplayId=null;
  var composite=null, activeVideoUrl=null, pendingVideoUrl=null;
  var videoFailed=false, displayRequest=0, compositeRequest=0;
  var videosSignature=null, layananSignature=null, layananIntervals=[];
  var lastDisplayId=null;

  function $(id){return document.getElementById(id)}
  function showErr(m){var e=$('err'); e.style.display='block'; e.innerHTML=m}
  function clearErr(){var e=$('err'); e.style.display='none'; e.innerHTML=''}
  function pad(n){return n<10?'0'+n:''+n}
  function witaParts(d){
    d=d||new Date();
    if(window.Intl&&Intl.DateTimeFormat){
      try{
        var f=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
        var a=f.formatToParts(d), o={};
        for(var i=0;i<a.length;i++){o[a[i].type]=a[i].value}
        return {y:o.year,m:o.month,d:o.day,h:o.hour==='24'?'00':o.hour,i:o.minute,s:o.second}
      }catch(e){}
    }
    var u=new Date(d.getTime()+8*60*60*1000);
    return {y:u.getUTCFullYear(),m:pad(u.getUTCMonth()+1),d:pad(u.getUTCDate()),h:pad(u.getUTCHours()),i:pad(u.getUTCMinutes()),s:pad(u.getUTCSeconds())}
  }
  function witaTime(d){var p=witaParts(d); return p.h+':'+p.i+':'+p.s}
  function today(){var p=witaParts(new Date()); return p.y+'-'+p.m+'-'+p.d}
  function setSync(){$('sync').innerHTML='sync: '+witaTime(new Date())+' '+TZ_LABEL}
  function getJSON(url,cb){
    var x=new XMLHttpRequest(), done=false;
    function finish(err,res){if(done)return;done=true;x.onreadystatechange=null;x.ontimeout=null;cb(err,res)}
    x.open('GET',url,true);
    x.timeout=10000;
    x.onreadystatechange=function(){
      if(x.readyState===4){
        if(x.status>=200&&x.status<300){try{finish(null,JSON.parse(x.responseText))}catch(e){finish(e)}}
        else finish(new Error(x.status===0?'Request failed: '+url:'HTTP '+x.status+' '+url))
      }
    };
    x.ontimeout=function(){finish(new Error('Request timed out: '+url))};
    x.send()
  }
  function text(v){return (v===null||v===undefined)?'':String(v)}
  function esc(v){return text(v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c})}
  function setAnnouncerStatus(m){var e=$('announce'); if(e)e.innerHTML='🔔 announcer: '+esc(m)}

  function queryParam(name){
    var q=window.location.search.substring(1);
    if(!q) return null;
    var parts=q.split('&');
    for(var i=0;i<parts.length;i++){
      var kv=parts[i].split('=');
      if(kv[0]===name) return decodeURIComponent((kv[1]||'').replace(/\+/g,' '));
    }
    return null
  }

  // Refresh announcer settings on every config poll, but only reset the
  // announcement dedupe when the display identity actually changes — a 15s
  // config poll must never cause the same queue to re-announce.
  // parseFloat(v||fallback) breaks volume 0 (falsy) — honor explicit 0.
  function parseVolume(value, fallback){
    var n=parseFloat(value);
    return isNaN(n)||!isFinite(n)?fallback:Math.max(0,Math.min(1,n))
  }

  function initAnnouncer(resetKeys){
    announcerSettings=(display&&display.settings)||{};
    if(resetKeys){lastAnnounced={}}
    if(!announcerSettings.announcer_enabled){setAnnouncerStatus('off'); return}
    setAnnouncerStatus(audioUnlocked?'siap':'tekan OK')
  }

  function unlockAudio(){
    audioUnlocked=true;
    try{
      var a=new Audio('/sounds/silence.wav');
      a.volume=0.01;
      var p=a.play();
      if(p&&p.catch)p.catch(function(){});
      setTimeout(function(){try{a.pause();a.src=''}catch(e){}},250)
    }catch(e){}
    initAnnouncer(false)
  }

  function announcementKey(q){
    return q?String(q.id)+'|'+text(q.called_at||q.created_at||q.status):''
  }

  // ── VIDEO MOUNT / DECODER HANDOFF ─────────────────────────────────────────
  // Fresh <video> element each (re)mount — Tizen 3 has ONE hardware decoder,
  // it must never be revived on a dead node.
  function mountVideo(){
    var host=$('video-host');
    host.innerHTML='<video id="vid" style="max-width:100%;max-height:100%;width:auto;height:auto;display:block" muted></video>';
    var v=$('vid');
    v.onloadedmetadata=fitVideo;
    return v
  }

  // Explicitly release the hardware decoder BEFORE the announcer Audio starts:
  // pause, drop src, load. New Audio gets the decoder; the video element is
  // recreated fresh (mountVideo) once the Audio ends.
  function releaseVideoDecoder(){
    var v=$('vid');
    if(!v) return;
    try{
      v.pause();
      v.removeAttribute('src');
      v.load();
    }catch(e){}
  }

  function recreateVideoElement(idx, time, muted){
    var v=mountVideo();
    var vol=parseVolume(announcerSettings&&announcerSettings.volume,1);
    v.onerror=function(){
      showErr('Video error. Pastikan MP4 H.264 + AAC');
      if(videos.length>1) setTimeout(function(){playVideo(videoIndex+1)},1500)
    };
    v.onended=function(){playVideo(videoIndex+1)};
    v.src=videos[idx%videos.length].file_url;
    v.muted=muted!==undefined?muted:!started;
    v.volume=vol;
    v.load();
    var p=v.play&&v.play();
    if(p&&p.catch)p.catch(function(){});
    // After play starts, ensure unmuted with volume if started
    if(started&&!muted){
      setTimeout(function(){
        var ve=$('vid');
        if(ve){ve.muted=false;ve.volume=vol}
      },500)
    }
    return v
  }

  function fitVideo(){
    var v=$('vid');
    if(!v)return;
    var box=v.parentNode;
    if(!box)return;
    var bw=box.clientWidth||1, bh=box.clientHeight||1;
    var vr=(v.videoWidth||1)/(v.videoHeight||1);
    var br=bw/bh;
    v.removeAttribute('style');
    if(vr>br){v.style.width='100%';v.style.height='auto'}
    else{v.style.width='auto';v.style.height='100%'}
    v.style.display='block'
  }

  function playVideo(i){
    if(!videos.length) return;
    videoIndex=i%videos.length;
    if(isAnnouncing) return; // don't interrupt announcer
    var v=recreateVideoElement(videoIndex, 0, !started);
    fitVideo()
  }

  // ── SERVER PRE-RENDERED COMPOSITE (single <video>, master volume) ──────────
  function compositeStatusText(status){
    if(status==='building') return 'Menyiapkan video gabungan...';
    if(status==='empty') return 'Tidak ada display aktif';
    if(status==='error') return 'Gagal membuat video gabungan';
    return 'Video gabungan tidak tersedia';
  }

  function showCompositeStatus(status,message){
    var el=$('novideo');
    el.style.display='flex';
    el.innerHTML=esc(compositeStatusText(status))+(message?' &mdash; '+esc(message):'')
  }

  function loadCompositeVideo(url){
    var v=mountVideo();
    videoFailed=false;
    v.onerror=function(){videoFailed=true;showErr('Video gabungan error. Periksa renderer di server.')};
    v.onended=function(){
      if(pendingVideoUrl){loadCompositeVideo(pendingVideoUrl);return}
      var p=v.play&&v.play(); if(p&&p.catch)p.catch(function(){})
    };
    v.src=url;
    activeVideoUrl=url; pendingVideoUrl=null;
    v.muted=!started;
    v.volume=1; // master volume — composite audio already mixes per-display volume
    v.load();
    if(started){var p=v.play&&v.play(); if(p&&p.catch)p.catch(function(){})}
    fitVideo()
  }

  function applyComposite(){
    var data=composite||{};
    var url=data.video_url||null;
    var status=data.status||'unavailable';
    if(status==='empty'){
      releaseVideoDecoder(); $('video-host').innerHTML='';
      activeVideoUrl=null; pendingVideoUrl=null; videoFailed=false;
      showCompositeStatus(status,data.message); return
    }
    if(url&&data.displays&&data.displays.length){
      $('displayName').innerHTML='Video Gabungan ('+data.displays.length+' display)';
      var names=[];
      for(var ni=0;ni<data.displays.length;ni++){names.push(esc(data.displays[ni].name||('Display '+data.displays[ni].id)))}
      $('displayLoc').innerHTML=names.join(' · ')
    }
    if(url){
      $('novideo').style.display='none';
      if(activeVideoUrl===url&&!videoFailed) return; // unchanged healthy generation — no reload
      if(!activeVideoUrl||videoFailed){
        if(isAnnouncing){pendingVideoUrl=url;return} // one decoder: wait for handoff
        loadCompositeVideo(url);
      } else {
        pendingVideoUrl=url                          // takeover at next clip loop / handoff
      }
    } else {
      if(activeVideoUrl) return;                     // keep previous good MP4 while building/error
      showCompositeStatus(status,data.message)
    }
  }

  function loadComposite(){
    var request=++compositeRequest;
    getJSON(API+'/display-composite',function(err,res){
      if(request!==compositeRequest) return;
      if(err){
        if(!activeVideoUrl) showCompositeStatus('unavailable','status gagal dimuat');
        return
      }
      composite=(res&&res.data)||{};
      applyComposite()
    })
  }

  function showDisplayNotFound(){
    display=null;
    announcerSettings={};
    setAnnouncerStatus('off');
    $('displayName').innerHTML='Display tidak ditemukan';
    $('displayLoc').innerHTML='';
    activeVideoUrl=null; pendingVideoUrl=null; videos=[]; videosSignature=null;
    $('video-host').innerHTML='';
    var el=$('novideo');
    el.style.display='flex';
    el.innerHTML='Display tidak ditemukan. Periksa parameter display pada tautan.';
    clearLayananIntervals(); layananSignature=null;
    var g=$('grid'); if(g){g.innerHTML=''}
  }

  // ── ANNOUNCER AUDIO PLAYBACK ─────────────────────────────────────────────
  function finishAnnouncerAudio(){
    if(!isAnnouncing) return;
    isAnnouncing=false;
    setAnnouncerStatus(audioUnlocked?'siap':'tekan OK');
    savedVideoTime=0;
    if(compositeMode){
      var url=pendingVideoUrl||activeVideoUrl;
      if(url){loadCompositeVideo(url)} // handoff also applies a pending generation
      return
    }
    if(!videos.length) return;
    recreateVideoElement(savedVideoIndex, savedVideoTime, false)
  }

  function playAnnouncerAudio(url, label){
    isAnnouncing=true;
    setAnnouncerStatus('memutar '+label);
    releaseVideoDecoder(); // free the single decoder BEFORE the Audio starts
    if(announceAudio){announceAudio.pause();announceAudio=null}
    announceAudio=new Audio(url);
    announceAudio.volume=parseVolume(announcerSettings.announcer_volume,parseVolume(announcerSettings.volume,1));
    var done=false;
    var finish=function(){
      if(done)return; done=true;
      clearTimeout(timer);
      if(announceAudio){
        try{announceAudio.pause();announceAudio.removeAttribute('src');announceAudio.load()}catch(e){}
      }
      announceAudio=null;
      finishAnnouncerAudio()
    };
    announceAudio.onended=finish;
    announceAudio.onerror=function(){
      setAnnouncerStatus('audio error');
      finish()
    };
    var timer=setTimeout(finish,30000);
    var p=announceAudio.play();
    if(p&&p.catch)p.catch(function(){setAnnouncerStatus('gagal play');finish()})
  }

  function playAnnouncer(q,l){
    if(!q||isAnnouncing) return;
    if(!(q.status==='called'||q.status==='serving')) return;
    var key=announcementKey(q);
    var mapKey=String(l.id);
    if(lastAnnounced[mapKey]===key) return;
    if(!announcerSettings.announcer_enabled){setAnnouncerStatus('off');return}
    if(!audioUnlocked){setAnnouncerStatus('tekan OK');return}
    // Record only when actually announcing — a pre-unlock poll must not burn
    // the key, and later polls must still dedupe to exactly one TTS play.
    lastAnnounced[mapKey]=key;
    isAnnouncing=true;
    setAnnouncerStatus('membuat audio '+q.ticket_number);
    // Always use dynamic TTS
    getJSON(API+'/tts/queue/'+q.id,function(err,res){
      if(err){setAnnouncerStatus('tts gagal');isAnnouncing=false;if(lastAnnounced[mapKey]===key)delete lastAnnounced[mapKey];return}
      playAnnouncerAudio(res.audio_url, res.ticket_number||q.ticket_number)
    })
  }

  function ensurePlayback(){
    var v=$('vid');
    if(!v||isAnnouncing) return;
    if(compositeMode){
      if(!activeVideoUrl) return;
      v.muted=false; v.volume=1; // pre-mixed master
      var cp=v.play&&v.play(); if(cp&&cp.catch)cp.catch(function(){});
      return
    }
    if(!videos.length) return;
    var vol=parseVolume(announcerSettings&&announcerSettings.volume,1);
    v.muted=vol<=0; v.volume=vol;
    var p=v.play&&v.play(); if(p&&p.catch)p.catch(function(){})
  }

  // Idempotent: the first OK/Enter starts; repeated remote presses only
  // unlock/ensure playback of the EXISTING element — never reload/reset it.
  function start(){
    if(started){ ensurePlayback(); return }
    started=true;
    $('start').style.display='none';
    unlockAudio();
    ensurePlayback()
  }

  document.onkeydown=function(e){
    e=e||window.event;
    var k=e.key||e.keyCode;
    if(k==='Enter'||k===' '||k==='OK'||k===13||k===32) start()
  };
  $('start').onclick=start

  function tickClock(){
    var d=new Date();
    var ds=d.toLocaleDateString?d.toLocaleDateString('id-ID',{timeZone:TZ,weekday:'long',day:'numeric',month:'long',year:'numeric'}):today();
    $('date').innerHTML=ds+' · '+TZ_LABEL;
    var wt=witaTime(d)+' '+TZ_LABEL;
    var ts=document.querySelectorAll('.time');
    for(var i=0;i<ts.length;i++){ts[i].innerHTML=wt}
  }
  setInterval(tickClock,1000); tickClock()

  // ── CONFIG POLLING (≤15s) ───────────────────────────────────────────────────
  function loadDisplay(){
    var request=++displayRequest;
    getJSON(API+'/displays',function(err,res){
      if(request!==displayRequest) return;
      if(err){showErr('Gagal display: '+err.message);return}
      var arr=res.data||[];
      if(explicitDisplayId!==null){
        var found=null;
        for(var i=0;i<arr.length;i++){if(String(arr[i].id)===explicitDisplayId){found=arr[i];break}}
        display=found||null;
        if(!display){
          // Unknown explicit ID: clear not-found state, never fall back to
          // another display's playlist and never use the composite.
          if(lastDisplayId!=='not-found'){showDisplayNotFound(); lastDisplayId='not-found'}
          return
        }
      } else {
        display=null;
        for(var j=0;j<arr.length;j++){if(arr[j].is_active){display=arr[j];break}}
      }
      var currentId=display?display.id:null;
      var changed=lastDisplayId!==currentId;
      lastDisplayId=currentId;
      if(display){
        $('displayName').innerHTML=esc(display.name);
        $('displayLoc').innerHTML=esc(display.location||'');
      } else {
        $('displayName').innerHTML='Tidak ada display aktif';
        $('displayLoc').innerHTML=''
      }
      initAnnouncer(changed);
      if(compositeMode){ loadComposite() } else { loadVideos() }
      loadLayanans()
    })
  }

  function videoSignature(list){
    var s='';
    for(var i=0;i<list.length;i++){s+=list[i].id+':'+list[i].file_url+'|'}
    return s
  }

  function loadVideos(){
    if(!display) return;
    var currentId=display.id;
    getJSON(API+'/videos?display_id='+currentId+'&is_active=1',function(err,res){
      if(!display||display.id!==currentId) return;
      if(err){$('novideo').innerHTML='Video gagal dimuat';$('novideo').style.display='flex';return}
      var raw=res.data||[], list=[];
      for(var i=0;i<raw.length;i++){if(raw[i].is_active){list.push(raw[i])}}
      list.sort(function(a,b){return a.playlist_order-b.playlist_order||a.id-b.id});
      var sig=videoSignature(list);
      var changed=sig!==videosSignature;
      videos=list; videosSignature=sig;
      if(!videos.length){
        releaseVideoDecoder(); $('video-host').innerHTML='';
        $('novideo').style.display='flex';
        $('novideo').innerHTML='Tidak ada video aktif';
        return
      }
      $('novideo').style.display='none';
      if(changed&&!isAnnouncing){
        // Real playlist change only — an unchanged playlist never reloads the
        // running <video> (single decoder stays untouched).
        videoIndex=videoIndex%videos.length;
        recreateVideoElement(videoIndex, 0, !started)
      }
    })
  }

  function modeClass(n){
    return n<=2?'mode-few':(n>4?'mode-many':'mode-normal')
  }

  function defaultLoket(l){
    if(l&&l.counter&&l.counter.name) return l.counter.name;
    if(display&&display.settings&&display.settings.counter_id) return 'Loket terpilih';
    return 'Semua loket'
  }

  function clearLayananIntervals(){
    for(var i=0;i<layananIntervals.length;i++){clearInterval(layananIntervals[i])}
    layananIntervals=[]
  }

  function layananKey(list){
    var k='';
    for(var i=0;i<list.length;i++){k+=list[i].id+','}
    return k
  }

  function loadLayanans(){
    getJSON(API+'/layanans?active_only=1',function(err,res){
      if(err){showErr('Gagal layanan: '+err.message);return}
      clearErr();
      var list=res.data||[];
      var key=layananKey(list);
      if(key===layananSignature) return; // unchanged config: keep cards + intervals
      layananSignature=key;
      clearLayananIntervals();
      renderLayanans(list)
    })
  }

  function renderLayanans(list){
    var g=$('grid');
    if(!g){g=document.createElement('div'); g.id='grid'; g.className='queue-row'; document.body.appendChild(g)}
    g.innerHTML='';
    document.body.className=modeClass(list.length);
    for(var i=0;i<list.length;i++){
      (function(l){
        var card=document.createElement('div');
        card.className='card';
        card.innerHTML='<div class="service"><div class="service-name">'+esc(l.name)+'</div><div class="service-code">'+esc(l.code)+'</div></div><div class="body"><div class="ticket js-ticket">-</div><div class="loket js-loket">'+esc(defaultLoket(l))+'</div><div class="status js-status waiting">Menunggu antrian</div></div>';
        g.appendChild(card);
        updateQueue(l,card);
        var iv=setInterval(function(){updateQueue(l,card)},3000);
        layananIntervals.push(iv)
      })(list[i])
    }
  }

  function updateQueue(l,card){
    var url=API+'/layanans/'+l.id+'/queues?status=called,serving,completed&date='+today();
    var cid=display&&display.settings?display.settings.counter_id:null;
    if(cid) url+='&counter_id='+cid;
    getJSON(url,function(err,res){
      if(err) return;
      setSync();
      var q=res.data||[];
      q.sort(function(a,b){return new Date(b.called_at||b.created_at)-new Date(a.called_at||a.created_at)});
      var cur=null;
      for(var i=0;i<q.length;i++){
        if(q[i].status==='serving'||q[i].status==='called'){cur=q[i];break}
      }
      if(!cur) cur=q[0];
      var loket=cur&&cur.counter&&cur.counter.name?cur.counter.name:defaultLoket(l);
      var st=card.getElementsByClassName('js-status')[0];
      card.getElementsByClassName('js-ticket')[0].innerHTML=cur?esc(cur.ticket_number):'-';
      card.getElementsByClassName('js-loket')[0].innerHTML=esc(loket);
      var isCalling=cur&&(cur.status==='serving'||cur.status==='called');
      st.className='status js-status '+(isCalling?'calling':(cur&&cur.status==='completed'?'completed':'waiting'));
      st.innerHTML=cur?(cur.status==='completed'?'Terakhir selesai':'Sedang dipanggil'):'Menunggu antrian';
      if(isCalling){
        if(!isAnnouncing){
          savedVideoIndex=videoIndex;
          savedVideoTime=0;
          var v=$('vid');
          if(v&&!v.paused) savedVideoTime=v.currentTime||0;
        }
        playAnnouncer(cur,l)
      }
    })
  }

  compositeMode=queryParam('display')===null;
  explicitDisplayId=compositeMode?null:queryParam('display');
  loadDisplay();
  setInterval(loadDisplay,15000);
})()
</script>
</body>
</html>
